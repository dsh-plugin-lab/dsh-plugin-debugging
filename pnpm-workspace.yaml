# pnpm workspace root. Declared even with a single package — otherwise pnpm treats this as a
# non-workspace directory and the dependency tree stops matching the one CI installs.
packages:
  - '.'
allowBuilds:
  esbuild: true

# minimumReleaseAgeExclude：pnpm 11 的供应链门禁默认拒收「发布不足 24 小时」的版本，
# 而本仓跟的是宿主的 rc 线 —— 刚发布的 rc 天然落在 24 小时内，不放行就装不上
# （本机与 CI 同样停在 install，报 ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION）。
#
# 逐条列出被拒的那批宿主包，而不是把整道门禁关掉：门禁对**其余每个包**继续生效，
# 那才是它该管的地方。代价是每次抬宿主线都要补一轮 —— 清单由 pnpm 自己报出来，照抄即可。
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent@0.2.2-rc.3'
  - '@deepseek-ai/dsh-brand@0.2.2-rc.3'
  - '@deepseek-ai/dsh-client-locale@0.2.2-rc.3'
  - '@deepseek-ai/dsh-client-ui-plugin-manager@0.2.2-rc.3'
  - '@deepseek-ai/dsh-client-ui-primitives@0.2.2-rc.3'
  - '@deepseek-ai/dsh-client-ui-renderer@0.2.2-rc.3'
  - '@deepseek-ai/dsh-client-ui-slots@0.2.2-rc.3'
  - '@deepseek-ai/dsh-error@0.2.2-rc.3'
  - '@deepseek-ai/dsh-llm@0.2.2-rc.3'
  - '@deepseek-ai/dsh-scope@0.2.2-rc.3'
  - '@deepseek-ai/dsh-session-projection@0.2.2-rc.3'
  - '@deepseek-ai/dsh-session@0.2.2-rc.3'
  - '@deepseek-ai/dsh-skill@0.2.2-rc.3'
  - '@deepseek-ai/dsh-system-prompt@0.2.2-rc.3'
  - '@deepseek-ai/dsh-timeout@0.2.2-rc.3'
  - '@deepseek-ai/dsh-tools@0.2.2-rc.3'
  - '@deepseek-ai/dsh-typert-protocol@0.2.2-rc.3'
  - '@deepseek-ai/dsh-user-approval@0.2.2-rc.3'
  - '@deepseek-ai/dsh-util-crypto@0.2.2-rc.3'
  - '@deepseek-ai/dsh-util-values@0.2.2-rc.3'

# 字段是 `allowBuilds`（pnpm 11 的形状），**不是** package.json 里的 `pnpm.onlyBuiltDependencies`
# —— 后者在本版被忽略、只打印一条警告，装了等于没装（实测：`ERR_PNPM_IGNORED_BUILDS` 直接让 install 失败）。
#
# esbuild 在 2026-10-15 **重新成为需要的**：客户端半边的 `scripts/build-client.mjs` 用它打浏览器包
# （此前正是因为它带 postinstall 才被去掉，见根 AGENTS.md 活跃坑 10）。
# 所以这一项显式设为 `true`，而不是让它变成一次「被忽略的构建脚本」。
