# 发布：两个等价入口，进的是同一个 job、同一条全有或全无的顺序。
#   ① 手动触发 —— Actions → release → Run workflow（带 dry-run 时只检查与打包）。
#   ② 推 tag —— `git push origin v<版本>`。
# 两条路各自的闸不同：手动触发只接受 main，tag 触发要求 tag 名 == v + 清单版本。
#
# 认证用 npm Trusted Publishing（OIDC），没有 NPM_TOKEN 这种东西。
# 代价是必须在 npmjs.com 上为本包配一次 trusted publisher（见 docs/PUBLISHING.md），
# 收益是仓库里不存任何长期凭据，代币由 GitHub 现签、用完即废。
#
# 为什么本仓**不需要** GitHub App token：本流程只推 tag、不推 main。
# 要往受保护分支直推就得多一把 App 私钥（姊妹仓 dsh-zhihu-search 就是那样），
# 而本仓刻意选了「零 secret」那条路 —— 这也是它比另两份模板短的原因。
#
# 顺序是全有或全无：先证明产物是对的，再发。任何一步红了，后面都不会跑。
#
# 幂等：目标版本已在 npm 上就跳过 publish。
# ⚠️ **`exists` 只喂 `Publish` 一步**：git 侧（tag / Release）的成立与否与「这个版本在不在
# npm 上」无关 —— 若拿它当 tag / Release 的前提，「publish 成功但后面某步失败」就会**永久卡死**
# （重跑时 exists 已是 true ⇒ 两步被跳过 ⇒ 这个版本永远没有 tag / Release，而重跑救不回来）。
# 那两步各自内部本来就幂等（`git rev-parse` / `gh release view`），「已存在」由它们自己处理。
#
# 预发布：版本号里带预发布段（如 0.2.0-alpha.1）时，会发到**同名 dist-tag**，
# latest 保持不动；不带预发布段时照旧发 latest。
#
# **版本驱动：本 workflow 不 bump 版本。** 发布的就是 package.json 里那个号 ——
# 版本号是发布**之前**的独立一步（先 bump → 提交 → 再发布），
# 理由：界面上的版本号就是清单里那个号，workflow 自己 bump 会让工作树永远停在
# 「上一个已发布版本」。这条由 `pnpm run check:release` 的「发布流程不改写版本号」钉住。
#
# 改本文件后**必须手动 dispatch 实跑一次**：PR 上的 CI 只跑 ci.yml，
# 动 release.yml 的 PR 就算绿勾也不代表发布链路验过。
#
# 安装走 pnpm（唯一锁文件 pnpm-lock.yaml，已无 package-lock.json）。
name: release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 只做检查与打包，不真的发布，也不打 tag
        type: boolean
        default: false
  # tag 入口。tag 名形状与守卫的 `--match 'v[0-9]*'` 同形：不带 v 的 tag 那道守卫看不见。
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 在仓库设置里建一个同名 environment，可以给它加人工审批与环境保护规则。
    # npm 侧 Trusted Publisher 配的 environment 名必须与这里逐字一致。
    environment: release
    permissions:
      contents: write # 发布成功后打 tag 用
      id-token: write # Trusted Publishing 的 OIDC 换发
    steps:
      # 手动触发只接受 main；tag 触发天然指向某个提交，由下面那道 tag/清单一致性闸来管。
      # ⚠️ 这道判定**必须带 github.event_name 守卫**：不带的话 tag 触发时 github.ref 是
      # refs/tags/...，每一次 tag 发布都红 —— 而且红的原因离真正的原因很远。
      - name: Verify this dispatch came from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::发版只能从 main 触发，当前 ref 是 ${{ github.ref }}"
          exit 1

      # release-guard 要 diff「上个 tag..HEAD」，浅克隆里没有 tag。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # pnpm 必须排在 setup-node **之前**，否则 `cache: pnpm` 找不到 store。
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          # Trusted Publishing 要求 npm 走官方 registry 换 OIDC，别指向镜像。
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      # 版本号只写在 package.json 一处：pnpm-lock v9 不记录根包自身的版本，所以 npm 仓那种
      # 「lockfile 版本 == 清单版本」的交叉核对在本仓不存在对应物。「忘了 bump」由下面那道
      # 「该版本已在 npm 上」的幂等判据兜住（报的是已存在，而不是发一个内容相同的新版本出去）。
      # `--frozen-lockfile` 已经承担了「锁文件与清单必须同步」那一半：对不上直接失败。

      - name: Typecheck
        run: pnpm run typecheck

      # **必须构建**：`main` 与 `exports` 指向 `lib/`，而 `/lib/` 是**构建产物**、被
      # `.gitignore` 忽略 —— 检出里根本没有它。ci.yml 里本来就有这一步，但本 workflow
      # 曾经漏了它：`0.2.0` 发出去的 tarball 只有 9 个文件、**没有一行代码**，
      # 装上去连入口都解析不到（静默挂不起来）。守卫见 check-release.mjs 的第 11 条。
      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      # 发布态不变量：bundle 声明在不在、private 去掉没有、SKILL.md 随不随包。
      # 判据是组织仓的 Must agree 一条，本仓的执行体是 scripts/check-release.mjs。
      - name: Release preconditions
        run: pnpm run check:release

      # tag 触发时：tag 名必须就是 v + 清单里的版本号。
      # 没有这道闸就会出现「tag 是 v0.3.0、实际发的是 0.2.0」，而 npm 的版本号不可覆盖。
      - name: Verify the pushed tag matches the manifest version
        if: github.event_name == 'push'
        run: |
          want="v$(node -p "require('./package.json').version")"
          got="${{ github.ref_name }}"
          if [ "$got" != "$want" ]; then
            echo "::error::推的是 $got，而 package.json 是 $want —— tag 与清单版本必须一致"
            exit 1
          fi
          echo "$got 与清单一致，继续。"

      # 产物没变就不该发版 —— 发了等于制造一个内容相同的新版本号。
      # 首次发版还没有任何 tag，这一步自动跳过。
      #
      # ⚠️ **基线要排掉「正在发的 / 当前这个版本自己的」tag**：这一步要回答的是「**自从上一个
      # 发布之后**有没有产物改动」，而不是「自从当前这个已存在的 tag 之后」。不排掉的话 HEAD 就是
      # 那个 tag 指向的提交，`describe` 解析出它自己、`<tag>..HEAD` 恒空 —— 一次完全正常的发布
      # （或一次「只差 Release」的回填）会被判成「没有可发布的内容」，守卫 exit 1、job 停。
      #
      # 两条规则各自独立成立：
      #   ① tag 入口：HEAD 就是被推的那个 tag 的提交 ⇒ 排掉 `github.ref_name`；
      #   ② 手动入口：当前版本自己的 tag 已经建好了（典型场景：publish 与 tag 都成了，只有建
      #      Release 那步失败，想再 dispatch 一次补出来）⇒ 排掉 `v` + 清单里的版本号。
      #      tag 还没建时 ② 是空操作，所以**全新发布的正常路径逐字不变**。
      # ② 写成 `elif` 而不是第二个 `if`：tag 入口下上面那道一致性闸已经保证
      # `ref_name == want`，两条规则在那种情况下是同一个值，写成两个 `if` 只会得到重复的 `--exclude`。
      - name: Release guard
        run: |
          want="v$(node -p "require('./package.json').version")"
          exclude=""
          if [ "${{ github.event_name }}" = "push" ]; then
            exclude="--exclude=${{ github.ref_name }}"
          elif git rev-parse -q --verify "refs/tags/$want" >/dev/null; then
            exclude="--exclude=$want"
          fi
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' $exclude 2>/dev/null || true)
          if [ -z "$previous" ]; then
            # 空基线有两种成因，语义相同（都 =「没有可比基线 ⇒ 守卫不适用」），但**必须说清是哪一种**，
            # 否则「本来有更早的 tag 却被排空」这种真问题会静默溜过去：
            #   ① 仓里还没有任何 tag（首次发版）；
            #   ② 排掉当前版本自己的 tag 之后，再没有更早的 tag（例如只有这一个 tag）。
            # ② 不是「被排空」：若还有更早的 tag，`describe` 会解析出它，根本走不到这一支。
            # ② 也正是回填场景该有的结果 —— 没有上一个发布就没有可比的基线，守卫拦不得。
            echo "没有更早的 tag 可作基线（首次发版，或当前版本是唯一一个 tag），跳过守卫。"
            exit 0
          fi
          echo "对比 $previous..HEAD"
          git diff --name-only "$previous"..HEAD | node scripts/release-guard.mjs

      # 幂等：补跑一条已经发成功的流水线时，不该在 npm 那里撞一个 403 就停住。
      - name: Probe whether this version is already on npm
        id: probe
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version 已经在 npm 上，发布步骤会跳过。"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 预发布版本（如 0.2.0-alpha.1）发到它自己的 dist-tag（alpha），**不动 latest**。
      # dist-tag 由版本自己的预发布段推导，判据只此一处：publish 与 GitHub Release
      # 两步读同一个输出，避免「推 latest 的那一档其实是预发布」。
      - name: Publish
        if: steps.probe.outputs.exists == 'false'
        run: |
          tag=$(node -e "const v=require('./package.json').version; const p=v.split('-'); process.stdout.write(p.length>1 && /^[A-Za-z]/.test(p[1]) ? p[1].split('.')[0] : 'latest')")
          echo "dist-tag: $tag"
          npm publish --provenance --tag "$tag"${{ inputs.dry-run && ' --dry-run' || '' }}

      # git 侧的发布面：tag + GitHub Release。**两样都由流程产出，不靠人记得去补。**
      # tag 名 = `v` + package.json 里的版本号，前缀是**显式补**的：npm version 的输出自带 v，
      # 而 package.json 里没有；换数据来源时形状会跟着变，会把 tag 名带歪。
      # 形状是判据不是审美：守卫与巡检靠 `git describe --match 'v[0-9]*'` 看它，
      # 不带 v 的 tag 那个 `--match` **看不见**。
      #
      # ⚠️ **不吃 npm 的 `exists`**：tag 是 git 侧的事实，与 registry 上有没有这个版本无关。
      # 吃了它就等于「publish 成功、这一步失败」之后再无补救（见文件头的幂等说明）。
      # 这一步**自身已幂等**：下面 `git rev-parse` 命中就跳过，重跑不会撞已存在的 tag。
      - name: Tag the release
        if: ${{ !inputs.dry-run }}
        run: |
          tag="v${{ steps.probe.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag 已存在，跳过。"
          else
            git tag "$tag"
            git push origin "$tag"
          fi

      # 正文来源两级：**草稿 → `--generate-notes` 回落**。
      #
      # 草稿由 Release Drafter 维护（配置继承组织仓的 .github/release-drafter.yml，
      # tag 是滚动名 `next`，永不与 `v<版本>` 相撞 —— 所以上面的存在性判断不会命中草稿）。
      #
      # **必须断言「草稿真的被读到了吗」**：读不到草稿与「草稿为空」都会走回落，
      # 但前者是**配置坏了**（tag 改名、action 没跑、权限不足），后者是**正常情况**。
      # 不区分的话，「发版成功但正文其实走了回落」是静默失败。
      #
      # 清理只按 action 名匹配（`/Release Drafter/d`）而**不抄那句提示语的全文**：
      # 那句话归组织仓的模板所有，随时会被改写；照抄一句会变成一条静默失效的 sed。
      - name: Pick the release body (draft first, then --generate-notes)
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft="$(gh release view next --json body --jq '.body' 2>/dev/null || true)"
          if printf '%s' "$draft" | grep -q 'Release Drafter'; then
            printf '%s\n' "$draft" | sed '/Release Drafter/d' > /tmp/notes.md
            # 草稿可能只有标题没有条目（无 PR 时）：那种仍算「读到但为空」，走回落。
            if [ -n "$(grep -E '^[-*] ' /tmp/notes.md || true)" ]; then
              echo "source=draft" >> "$GITHUB_OUTPUT"
              echo "::notice::正文来自 Release Drafter 草稿（next）"
            else
              echo "source=generate" >> "$GITHUB_OUTPUT"
              echo "::notice::草稿读到了但没有条目（本版没有带标签的 PR），回落 --generate-notes"
            fi
          else
            echo "source=generate" >> "$GITHUB_OUTPUT"
            echo "::warning::读不到 Release Drafter 草稿（next）—— 回落 --generate-notes。"
            echo "::warning::若是配置坏了（tag 改名 / action 没跑 / 权限不足），这条 warning 就是唯一的信号。"
          fi

      # ⚠️ **同样不吃 npm 的 `exists`**，理由与 `Tag the release` 那步逐字相同：
      # 「tag 成功、建 Release 失败」之后，重跑必须能把 Release 补出来。
      # 这一步**自身已幂等**：下面 `gh release view` 命中就 `created=false` + 跳过。
      - name: Create the GitHub Release
        id: release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.probe.outputs.version }}"
          case "${{ steps.probe.outputs.version }}" in
            *-*) flags="--prerelease" ;;
            *)   flags="" ;;
          esac
          # 幂等：Release 已存在就跳过。**tag 触发后重跑必然撞上这一条** —— 原来没有这道判断。
          # `created` 输出让下面删草稿那步能区分「这次真的建了」与「已存在、正文没被取走」。
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag 的 Release 已存在，跳过。"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "建 Release：$tag $flags（正文来源：${{ steps.notes.outputs.source }}）"
          if [ "${{ steps.notes.outputs.source }}" = "draft" ]; then
            gh release create "$tag" --title "$tag" $flags --notes-file /tmp/notes.md
          else
            gh release create "$tag" --title "$tag" $flags --generate-notes
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"

      # 正文取走之后**必须把草稿让位**，否则下一次发版会读到上一批的正文。
      #
      # Release Drafter 以「最新的正式版」作分界线，它自己不认哪个草稿被消费过。
      # 不删的后果不是「草稿空白」，而是**草稿停在旧分界**（实测踩过：0.3.0 发版后
      # `next` 草稿的内容仍停在 0.3.0 之前那一批，#30–#33 全部不在里面）——
      # 正文是**上一批的**，而表面上看草稿「有内容」，属静默错。
      #
      # ⚠️ **`if` 必须与上面 `Create` 那条一致**（含 `!inputs.dry-run`）：dry-run
      # 不建任何正式版，若此时删掉草稿，那批正文就**永久丢了**。
      #
      # 另外还必须看 `created`：Release **已存在**而跳过时，正文并没有被取走，
      # 此时删草稿等于把那批正文**永久丢了** —— 这正是 tag 触发后重跑会走到的分支。
      #
      # 只删 tag 不以 `v` 开头的那一个草稿：不按标题匹配，也不碰任何 `v<版本>` 的正式版
      # （`gh release delete <tag>` 默认连带删 tag，这里显式关掉）。
      - name: Retire the drafter's next draft
        if: >-
          !inputs.dry-run
          && steps.notes.outputs.source == 'draft'
          && steps.release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft_tag="$(gh release list --limit 30 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft) | .tagName] | map(select(startswith("v") | not)) | .[0] // ""')"
          if [ -n "$draft_tag" ]; then
            gh release delete "$draft_tag" --yes --cleanup-tag=false
            echo "已删除草稿 $draft_tag（下一批合并后 Release Drafter 会重建它）"
          fi
